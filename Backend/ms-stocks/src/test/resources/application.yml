server:
  port: 8081

spring:
  application:
    name: ms-stocks
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:stocktestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
