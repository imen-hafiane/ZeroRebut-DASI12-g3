# À placer dans Backend/ms-offres/src/test/resources/application.yml
# Les tests tournent sans config-server, sans Eureka et sur H2
spring:
  application:
    name: ms-offres
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
