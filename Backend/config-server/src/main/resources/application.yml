server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Un fichier <spring.application.name>.yml par service dans resources/config/
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info
